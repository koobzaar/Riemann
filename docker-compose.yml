services:
  riemann-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RIEMANN_DB_PATH: /data/riemann.sqlite
      RIEMANN_GRAPH_PATH: /app/data/relation_graph.json
      RIEMANN_BLOCK_OUTBOUND_ON_INFERENCE: ${RIEMANN_BLOCK_OUTBOUND_ON_INFERENCE:-0}
      RIEMANN_FIXTURE_DIR: /app/tests/fixtures
    volumes:
      - riemann_sqlite:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2); assert r.status == 200",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  riemann_sqlite: {}

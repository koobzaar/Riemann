[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "riemann"
version = "0.1.0"
description = "Riemann: Statistical dynamic recommendation engine for League of Legends ARAM: Mayhem and Arena"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "rapidfuzz>=3.9.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "google-genai>=1.55,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "hypothesis>=6.112.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
